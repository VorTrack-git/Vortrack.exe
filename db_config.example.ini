; -------------------------------------------------------------------
; Plantilla de configuración de la base de datos de VorTrack.
;
; CÓMO USAR:
;   1. Copia este archivo y renómbralo a  db_config.ini
;   2. Reemplaza los valores con los de TU servidor SQL Server.
;   3. NO subas db_config.ini a Git (ya está en .gitignore).
;
; db_config.ini contiene tu contraseña, por eso queda fuera del repo.
; -------------------------------------------------------------------

[database]
; Nombre o IP del servidor. Ejemplos:
;   192.168.1.50
;   servidor.institucion.edu
;   NOMBREPC\SQLEXPRESS   (instancia con nombre; si usas instancia, deja port vacío)
server = TU_SERVIDOR_O_IP

; Puerto (por defecto 1433). Déjalo vacío si usas instancia con nombre (\SQLEXPRESS).
port = 1433

; Nombre de la base ya importada desde el .bacpac
database = vortrack_db

; Login de SQL Server (autenticación SQL)
username = TU_USUARIO

; Contraseña del login
password = TU_CONTRASENA

; Driver ODBC instalado (no cambiar salvo que uses otra versión)
driver = ODBC Driver 18 for SQL Server

; Cifrado. Con el Driver 18 conviene dejar estos dos en 'yes' para
; servidores sin certificado de confianza.
encrypt = yes
trust_server_certificate = yes
